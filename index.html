<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ハル ｜ 暮らしが激変するガジェット ― 紹介したアイテムまとめ</title>
<meta name="description" content="バーチャルインフルエンサー「ハル」が動画で紹介したアイテムを番号でまとめました。投稿で見た番号を入力すると、該当のアイテムにすぐ届きます。">
<style>
:root{
--navy:#1f2a44; --charcoal:#2b2f36; --ink:#1c2330; --sub:#5b6575;
--line:#e3e7ee; --bg:#f6f7f9; --card:#ffffff; --accent:#ffb400;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{margin:0; font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif; background:var(--bg); color:var(--ink);}
header{background:linear-gradient(160deg,var(--navy),var(--charcoal)); color:#fff; padding:28px 20px 22px; text-align:center;}
header.avatar{width:84px; height:84px; border-radius:50%; object-fit:cover; border:3px solid rgba(255,255,255,.85); background:#44506b;}
header h1{font-size:19px; margin:12px 0 4px; letter-spacing:.02em;}
header p{margin:0; font-size:12.5px; color:#cfd6e4; line-height:1.7;}
.search{position:sticky; top:0; background:var(--bg); padding:14px 16px 8px; z-index:5;}
.search input{width:100%; font-size:16px; padding:13px 14px; border:1.5px solid var(--line); border-radius:12px; outline:none; background:#fff;}
.search input:focus{border-color:var(--navy);}
.search.hint{font-size:11.5px; color:var(--sub); margin:7px 2px 0;}
main{padding:6px 16px 8px; max-width:560px; margin:0 auto;}
.item{display:flex; gap:12px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:13px 14px; margin:10px 0; text-decoration:none; color:inherit;}
.item:active{background:#eef1f6;}
.num{flex:0 0 auto; min-width:46px; text-align:center; background:var(--navy); color:#fff; font-weight:700; font-size:15px; border-radius:10px; padding:9px 0;}
.item.body{flex:1 1 auto; min-width:0;}
.item.name{font-size:15px; font-weight:700; line-height:1.45;}
.item.desc{font-size:12px; color:var(--sub); line-height:1.55; margin-top:2px;}
.item.go{flex:0 0 auto; font-size:12px; font-weight:700; color:var(--navy); background:#eef1f6; border-radius:999px; padding:7px 11px;}
.empty{display:none; text-align:center; color:var(--sub); font-size:13px; padding:26px 10px;}
footer{max-width:560px; margin:0 auto; padding:14px 20px 34px; font-size:11px; color:var(--sub); line-height:1.8;}
footer.box{border-top:1px solid var(--line); padding-top:12px;}
.howto{background:#fff; border:1px solid var(--line); border-radius:14px; padding:13px 15px; margin:12px 0 2px; font-size:12.5px; line-height:1.8; color:var(--ink);}
.howto b{color:var(--navy);}
</style>

<h1>ハル ｜ 暮らしが激変するガジェット</h1>
<p>都内1Kでひとり暮らしをしている会社員、ハルです（バーチャルインフルエンサー／AI）。<br>動画で紹介したアイテムを、番号でまとめました。</p>

<script>
// 番号は「投稿した順」に振る。新規投稿のたびに、この配列の先頭へ1件追加する。
// url は発信元に合わせて差し替える（既定はInstagram用リンク）。
const ITEMS = [
{ no: 6, name: "スパリブ（SUPALIV）", desc: "お酒を飲む人のためのサプリメント", url: "https://px.a8.net/svt/ejp?a8mat=4BGBN5+ARLAOI+3H28+5YJRM"},
{ no: 5, name: "メディテクト腰ベルト", desc: "腰サポーター（アンケート形式の投稿で紹介）", url: "https://px.a8.net/svt/ejp?a8mat=4BGH3J+NTG2A+5HQC+BXB8X"},
{ no: 4, name: "Cure:Re THE MAKURA", desc: "整体枕（図解の投稿で紹介）", url: "https://px.a8.net/svt/ejp?a8mat=4BGH3J+RE1OY+4GZK+5YJRM"},
{ no: 3, name: "Kimochi", desc: "オンラインカウンセリング（公認心理師のみ登録）", url: "https://px.a8.net/svt/ejp?a8mat=4BGH3I+GC8DJM+5OI8+5YJRM"},
{ no: 2, name: "Cure:Re THE MAKURA", desc: "整体枕（3段構造）", url: "https://px.a8.net/svt/ejp?a8mat=4BGH3J+RE1OY+4GZK+5YJRM"},
{ no: 1, name: "とくとくBB ホームWi-Fi", desc: "工事不要のホームWi-Fi（コンセントに挿すだけ）", url: "https://px.a8.net/svt/ejp?a8mat=4B7QWS+BOXKK2+50+7M040Y"}
];
const list = document.getElementById('list');
const empty = document.getElementById('empty');
function render(items){
list.innerHTML = items.map(it =>
'<a class="item" href="' + it.url + '" target="_blank" rel="nofollow sponsored noopener">' +
'<span class="num"></span>' +
'<span class="body"><span class="name">' + it.name + '</span>' +
'<span class="desc" style="display:block">' + it.desc + '</span></span>' +
'<span class="go">見る</span>' +
'</a>').join('');
empty.style.display = items.length? 'none': 'block';
}
render(ITEMS);
document.getElementById('q').addEventListener('input', e => {
const v = e.target.value.trim();
if(!v){ render(ITEMS); return;}
const digits = v.replace(/[^0-9０-９]/g,'').replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0));
const byNo = digits? ITEMS.filter(it => String(it.no) === digits): [];
const byWord = ITEMS.filter(it => (it.name + it.desc).includes(v));
render(byNo.length? byNo: byWord);
});
</script>
